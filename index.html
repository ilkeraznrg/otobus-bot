<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Servis Takip Paneli</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --bg: #ffffff;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #f1f5f9;
            --border-dark: #e2e8f0;
            --danger: #dc2626;
            --success: #059669;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0 0 40px 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header { 
            background: #ffffff;
            color: var(--text-main);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dark);
        }
        .header-title { margin: 0; font-size: 1em; font-weight: 700; letter-spacing: -0.02em; }
        
        .btn-auth {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid var(--border-dark);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78em;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-auth.logout { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

        .container { padding: 0 16px; max-width: 600px; margin: 0 auto; }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88em;
            cursor: pointer;
            margin: 16px 0 12px 0;
            display: none;
            text-align: center;
        }

        /* İSTATİSTİK BARI */
        .stats-bar { display: flex; gap: 12px; margin: 16px 0 12px 0; border-bottom: 1px solid var(--border-dark); padding-bottom: 12px; }
        .stat-card {
            flex: 1;
            text-align: left;
            cursor: pointer;
        }
        .stat-val { font-size: 1.2em; font-weight: 800; color: var(--text-main); }
        .stat-lbl { font-size: 0.7em; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .stat-card.active .stat-val { color: var(--primary); }

        /* ARAMA KUTUSU VE TARİH CHİPLERİ */
        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            font-size: 0.88em;
            margin-bottom: 8px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
        }
        .search-box:focus { border-color: var(--primary); background: #ffffff; }

        .chips-row {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .chips-row::-webkit-scrollbar { display: none; }
        .chip {
            background: #f1f5f9;
            border: 1px solid transparent;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.75em;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            height: 28px;
        }
        .chip.active { background: #0f172a; color: white; }

        /* YAN YANA HİZALANMIŞ TARİH SEÇİCİ */
        .chip-date-input {
            background: #f1f5f9;
            border: 1px solid var(--border-dark);
            padding: 0 10px;
            border-radius: 14px;
            font-size: 0.75em;
            font-family: inherit;
            color: var(--text-muted);
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            height: 28px;
            line-height: 26px;
            box-sizing: border-box;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
        }
        .chip-date-input:focus { border-color: var(--primary); background: #ffffff; }

        /* Tarih Seçici Varsayılan Metin ve Hizalama */
        .chip-date-input:invalid::-webkit-datetime-edit { color: transparent; }
        .chip-date-input:before {
            content: "Tarih Seç";
            color: var(--text-muted);
            font-weight: 500;
        }
        .chip-date-input:focus:before,
        .chip-date-input:valid:before { display: none; }

        /* COMPACT SHEET LİSTE STİLLERİ */
        .sheet-list { border-top: 1px solid var(--border-dark); }
        .sheet-item { border-bottom: 1px solid var(--border); transition: background-color 0.15s; }

        .sheet-summary {
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .sheet-summary.clickable { cursor: pointer; }
        .sheet-summary.clickable:active { background: #f8fafc; }

        .summary-main { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
        
        .plaka-text {
            font-weight: 700;
            font-size: 0.85em;
            color: #0f172a;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .divider-dot { color: #cbd5e1; font-size: 0.8em; }

        .islem-text {
            font-size: 0.82em;
            color: #475569;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }

        .summary-side { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .tarih-text { font-size: 0.75em; color: var(--text-muted); font-weight: 400; }
        .arrow-icon { font-size: 0.65em; color: #94a3b8; margin-left: 2px; }

        /* DETAY ALANI */
        .sheet-details {
            display: none;
            padding: 10px 0 14px 0;
            font-size: 0.82em;
            color: #334155;
            border-top: 1px dashed var(--border-dark);
        }

        .detail-block { margin-bottom: 8px; line-height: 1.4; }
        .detail-label { font-weight: 600; color: #0f172a; }

        .meta-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; color: var(--text-muted); }
        .meta-item { display: inline-flex; align-items: center; gap: 4px; }

        .contact-link { color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px; }

        .img-thumb {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            border: 1px solid var(--border-dark);
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
        }
        .btn-link {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            color: var(--primary);
        }
        .btn-link.danger { color: var(--danger); }

        .loader { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85em; }

        /* MODALLAR */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border-dark);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 12px; font-size: 0.95em; font-weight: 700; }
        .modal-content label { font-size: 0.75em; font-weight: 600; color: #475569; display: block; margin-top: 10px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
        }

        /* FOTOĞRAF ALANI STİLLERİ */
        .file-custom-input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            font-size: 0.8em;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
        }

        .photo-preview-box {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .preview-img-thumb { 
            width: 44px; 
            height: 44px; 
            object-fit: cover; 
            border-radius: 4px; 
            border: 1px solid var(--border-dark);
        }
        .btn-remove-photo {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            margin-top: 14px;
        }
        .btn-cancel {
            width: 100%;
            padding: 8px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            margin-top: 4px;
            font-size: 0.8em;
            cursor: pointer;
        }
        .error-msg { color: var(--danger); font-size: 0.75em; margin-top: 6px; display: none; }

        /* LIGHTBOX */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .lightbox-img { max-width: 100%; max-height: 90vh; border-radius: 6px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="header-title">Servis Takip</h2>
        <button id="auth-btn" class="btn-auth" onclick="handleAuthClick()">Giriş</button>
    </div>

    <div class="container">
        <button id="add-record-btn" class="btn-primary" onclick="openAddRecordModal()">+ Yeni Kayıt Ekle</button>

        <div class="stats-bar">
            <div class="stat-card active" id="card-total" onclick="setFilter('all')">
                <div class="stat-val" id="total-count">0</div>
                <div class="stat-lbl">Tüm Servisler</div>
            </div>
            <div class="stat-card" id="card-guarantee" onclick="setFilter('guarantee')">
                <div class="stat-val" id="guarantee-count">0</div>
                <div class="stat-lbl">Garantililer</div>
            </div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Plaka veya işlem ara..." onkeyup="filterRecords()">

        <!-- YAN YANA SIRALANAN HIZLI FİLTRE VE TARİH SEÇİCİ -->
        <div class="chips-row">
            <div class="chip active" onclick="setDateFilter('all', this)">Tümü</div>
            <div class="chip" onclick="setDateFilter('today', this)">Bugün</div>
            <div class="chip" onclick="setDateFilter('week', this)">Bu Hafta</div>
            <div class="chip" onclick="setDateFilter('month', this)">Bu Ay</div>
            <input type="date" id="custom-date-picker" class="chip-date-input" required onchange="setDateFilter('custom', this)">
        </div>

        <div id="loading" class="loader">Yükleniyor...</div>
        <div id="records-list" class="sheet-list"></div>
    </div>

    <!-- GİRİŞ MODAL -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>Giriş</h3>
            <input type="text" id="login-username" placeholder="Kullanıcı Adı">
            <input type="password" id="login-password" placeholder="Şifre">
            <button class="btn-save" onclick="loginUser()">Giriş Yap</button>
            <button class="btn-cancel" onclick="closeModal('login-modal')">İptal</button>
            <div id="login-error" class="error-msg">Hatalı kullanıcı adı veya şifre!</div>
        </div>
    </div>

    <!-- EKLEME / DÜZENLEME MODAL -->
    <div id="record-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Yeni Kayıt</h3>
            <input type="hidden" id="rec-id">
            <input type="hidden" id="existing-foto-url">

            <label>Plaka *</label>
            <input type="text" id="rec-plaka" list="plaka-suggestions" placeholder="Örn: 46 H 0123" style="text-transform: uppercase;">
            <datalist id="plaka-suggestions"></datalist>

            <label>Yapılan İşlem *</label>
            <textarea id="rec-islem" rows="3" placeholder="İşlem detayı..."></textarea>

            <label>Garanti Bitiş Tarihi</label>
            <input type="date" id="rec-garanti">

            <label>Ücret</label>
            <input type="text" id="rec-ucret" placeholder="Örn: 1500 TL">

            <label>Şoför / İletişim</label>
            <input type="text" id="rec-sofor" placeholder="Örn: Ahmet - 0532 000 0000">

            <label>Servis Fotoğrafı</label>
            
            <!-- Mevcut Fotoğraf Önizleme Ve Silme Kutusu -->
            <div id="photo-preview-box" class="photo-preview-box">
                <img id="preview-img-elem" class="preview-img-thumb" src="" alt="Mevcut Görsel">
                <span style="font-size:0.75em; color:#64748b; flex:1; margin-left:8px;">Mevcut Fotoğraf</span>
                <button type="button" class="btn-remove-photo" onclick="removeCurrentPhoto()">Kaldır</button>
            </div>

            <!-- Doğrudan Mobil Destekli Dosya / Kamera Girdisi -->
            <input type="file" id="rec-foto-input" accept="image/*" class="file-custom-input" onchange="handleFileChange(this)">

            <button id="save-btn" class="btn-save" onclick="saveRecord()">Kaydet</button>
            <button class="btn-cancel" onclick="closeModal('record-modal')">İptal</button>
            <div id="record-error" class="error-msg"></div>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox-modal" class="lightbox-modal" onclick="closeLightbox()">
        <img id="lightbox-img" class="lightbox-img" src="" alt="Fotoğraf">
    </div>

    <script>
        const SUPABASE_URL = "https://haqxyfhdfulvutqinuhc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhcXh5ZmhkZnVsdnV0cWludWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mzk0MzMsImV4cCI6MjEwMDIxNTQzM30.g3L_pR9Y9dm2uajA0mFT3nveEI8pxEQbWcZ46Q6rAos"; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allRecords = [];
        let isLoggedIn = false;
        let currentFilter = 'all';
        let selectedDateFilter = 'all';
        let selectedCustomDate = '';
        let activeSelectedFile = null;
        let isPhotoDeleted = false;

        const INACTIVITY_LIMIT = 15 * 60 * 1000;
        let inactivityTimer;

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (isLoggedIn) {
                inactivityTimer = setTimeout(() => logoutUser("Oturum süreniz doldu."), INACTIVITY_LIMIT);
            }
        }

        ['touchstart', 'mousemove', 'keydown', 'scroll', 'click'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer, true);
        });

        function formatDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('.')) return dateStr;
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function extractPhoneNumber(text) {
            if (!text) return null;
            const match = text.match(/(05\d{2}[-\s]?\d{3}[-\s]?\d{2}[-\s]?\d{2})/);
            return match ? match[0].replace(/[-\s]/g, '') : null;
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        function handleFileChange(inputElem) {
            if (inputElem.files && inputElem.files[0]) {
                activeSelectedFile = inputElem.files[0];
                isPhotoDeleted = false;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img-elem').src = e.target.result;
                    document.getElementById('photo-preview-box').style.display = 'flex';
                };
                reader.readAsDataURL(activeSelectedFile);
            }
        }

        function removeCurrentPhoto() {
            activeSelectedFile = null;
            isPhotoDeleted = true;
            document.getElementById('existing-foto-url').value = '';
            document.getElementById('photo-preview-box').style.display = 'none';
            document.getElementById('rec-foto-input').value = '';
        }

        function toggleCard(id) {
            if (!isLoggedIn) return;
            const details = document.getElementById(`details-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            if (details.style.display === 'block') {
                details.style.display = 'none';
                if (arrow) arrow.innerText = '▼';
            } else {
                details.style.display = 'block';
                if (arrow) arrow.innerText = '▲';
            }
        }

        function checkSession() {
            const savedUser = localStorage.getItem('panel_user');
            const addBtn = document.getElementById('add-record-btn');
            const authBtn = document.getElementById('auth-btn');
            
            if (savedUser) {
                isLoggedIn = true;
                authBtn.innerText = 'Çıkış Yap';
                authBtn.classList.add('logout');
                if (addBtn) addBtn.style.display = 'block';
                resetInactivityTimer();
            } else {
                isLoggedIn = false;
                authBtn.innerText = 'Giriş';
                authBtn.classList.remove('logout');
                if (addBtn) addBtn.style.display = 'none';
                clearTimeout(inactivityTimer);
            }
        }

        function logoutUser(message = null) {
            localStorage.removeItem('panel_user');
            checkSession();
            filterRecords();
            if (message) alert(message);
        }

        function handleAuthClick() {
            if (isLoggedIn) {
                logoutUser();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
                document.getElementById('login-error').style.display = 'none';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function openAddRecordModal() {
            document.getElementById('modal-title').innerText = "Yeni Kayıt";
            document.getElementById('rec-id').value = "";
            document.getElementById('existing-foto-url').value = "";
            document.getElementById('rec-plaka').value = "";
            document.getElementById('rec-islem').value = "";
            document.getElementById('rec-garanti').value = "";
            document.getElementById('rec-ucret').value = "";
            document.getElementById('rec-sofor').value = "";
            
            activeSelectedFile = null;
            isPhotoDeleted = false;
            document.getElementById('photo-preview-box').style.display = 'none';
            document.getElementById('rec-foto-input').value = '';

            document.getElementById('record-modal').style.display = 'flex';
            document.getElementById('record-error').style.display = 'none';
        }

        function openEditRecordModal(id) {
            const item = allRecords.find(r => r.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = "Kaydı Düzenle";
            document.getElementById('rec-id').value = item.id;
            document.getElementById('existing-foto-url').value = item.foto_url || "";
            document.getElementById('rec-plaka').value = item.plaka || "";
            document.getElementById('rec-islem').value = item.yapilan_islem || "";
            document.getElementById('rec-garanti').value = item.garanti_bitis || "";
            document.getElementById('rec-ucret').value = item.ucret || "";
            document.getElementById('rec-sofor').value = item.sofor_bilgi || "";
            
            activeSelectedFile = null;
            isPhotoDeleted = false;
            document.getElementById('rec-foto-input').value = '';

            const previewBox = document.getElementById('photo-preview-box');
            const previewImg = document.getElementById('preview-img-elem');

            if (item.foto_url && item.foto_url.trim() !== "") {
                previewImg.src = item.foto_url;
                previewBox.style.display = 'flex';
            } else {
                previewBox.style.display = 'none';
            }

            document.getElementById('record-modal').style.display = 'flex';
            document.getElementById('record-error').style.display = 'none';
        }

        function setFilter(type) {
            currentFilter = type;
            document.getElementById('card-total').className = type === 'all' ? 'stat-card active' : 'stat-card';
            document.getElementById('card-guarantee').className = type === 'guarantee' ? 'stat-card active' : 'stat-card';
            filterRecords();
        }

        function setDateFilter(type, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            
            if (type !== 'custom') {
                el.classList.add('active');
                document.getElementById('custom-date-picker').value = '';
            } else {
                selectedCustomDate = el.value;
            }

            selectedDateFilter = type;
            filterRecords();
        }

        async function loginUser() {
            const kAdi = document.getElementById('login-username').value.trim();
            const sifre = document.getElementById('login-password').value.trim();

            const { data } = await supabaseClient
                .from('yetkili_kullanicilar')
                .select('*')
                .eq('kullanici_adi', kAdi)
                .eq('sifre', sifre);

            if (data && data.length > 0) {
                localStorage.setItem('panel_user', kAdi);
                closeModal('login-modal');
                checkSession();
                filterRecords();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function saveRecord() {
            const recId = document.getElementById('rec-id').value;
            const existingFotoUrl = document.getElementById('existing-foto-url').value;
            const plakaInput = document.getElementById('rec-plaka').value.trim();
            const islem = document.getElementById('rec-islem').value.trim();
            const garanti = document.getElementById('rec-garanti').value;
            const ucret = document.getElementById('rec-ucret').value.trim();
            const sofor = document.getElementById('rec-sofor').value.trim();
            const errDiv = document.getElementById('record-error');
            const saveBtn = document.getElementById('save-btn');

            if (!plakaInput || !islem) {
                errDiv.innerText = "Lütfen Plaka ve Yapılan İşlem alanlarını doldurun.";
                errDiv.style.display = 'block';
                return;
            }

            let cleanPlaka = plakaInput.replace(/\s+/g, '').toUpperCase();
            const match = cleanPlaka.match(/^(0[1-9]|[1-8][0-9])([A-Z]{1,3})(\d{1,4})$/);

            if (!match) {
                errDiv.innerText = "Geçersiz plaka formatı!";
                errDiv.style.display = 'block';
                return;
            }

            const formattedPlaka = `${match[1]} ${match[2]} ${match[3].replace(/^0+/, '').padStart(4, '0')}`;
            saveBtn.innerText = "İşleniyor...";
            saveBtn.disabled = true;

            try {
                const { data: oData } = await supabaseClient.from('otobusler').select('plaka').eq('plaka', formattedPlaka);
                if (!oData || oData.length === 0) {
                    await supabaseClient.from('otobusler').insert([{ plaka: formattedPlaka }]);
                }

                let finalFotoUrl = isPhotoDeleted ? null : existingFotoUrl;

                if (activeSelectedFile) {
                    const filePath = `${formattedPlaka}_${Date.now()}.jpg`;
                    const { error: stErr } = await supabaseClient.storage.from('servis-fotolari').upload(filePath, activeSelectedFile, { contentType: 'image/jpeg' });
                    if (!stErr) {
                        const { data: pUrl } = supabaseClient.storage.from('servis-fotolari').getPublicUrl(filePath);
                        finalFotoUrl = pUrl.publicUrl;
                    }
                }

                const payload = {
                    plaka: formattedPlaka,
                    yapilan_islem: islem,
                    garanti_bitis: garanti || null,
                    ucret: ucret || null,
                    sofor_bilgi: sofor || null,
                    foto_url: finalFotoUrl
                };

                if (recId) {
                    await supabaseClient.from('servis_kayitlari').update(payload).eq('id', recId);
                } else {
                    payload.tarih = new Date().toISOString().split('T')[0];
                    await supabaseClient.from('servis_kayitlari').insert([payload]);
                }

                closeModal('record-modal');
                loadRecords();

            } catch (err) {
                errDiv.innerText = "Hata oluştu: " + err.message;
                errDiv.style.display = 'block';
            } finally {
                saveBtn.innerText = "Kaydet";
                saveBtn.disabled = false;
            }
        }

        async function deleteRecord(id, plaka) {
            if (!confirm(`${plaka} plakalı bu kaydı silmek istediğinize emin misiniz?`)) return;
            await supabaseClient.from('servis_kayitlari').delete().eq('id', id);
            loadRecords();
        }

        function updatePlakaSuggestions() {
            const datalist = document.getElementById('plaka-suggestions');
            if (!datalist) return;
            datalist.innerHTML = '';
            const uniquePlakas = [...new Set(allRecords.map(r => r.plaka).filter(Boolean))];
            uniquePlakas.forEach(plaka => {
                const option = document.createElement('option');
                option.value = plaka;
                datalist.appendChild(option);
            });
        }

        async function loadRecords() {
            try {
                const { data } = await supabaseClient
                    .from('servis_kayitlari')
                    .select('*')
                    .order('created_at', { ascending: false });

                document.getElementById('loading').style.display = 'none';
                allRecords = data || [];
                
                document.getElementById('total-count').innerText = allRecords.length;
                document.getElementById('guarantee-count').innerText = allRecords.filter(r => r.garanti_bitis).length;

                updatePlakaSuggestions();
                checkSession();
                filterRecords();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterRecords() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            const firstDayOfWeek = new Date(now);
            const day = now.getDay() || 7; 
            firstDayOfWeek.setDate(now.getDate() - day + 1);
            const weekStartStr = firstDayOfWeek.toISOString().split('T')[0];

            const monthStartStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;

            let filtered = allRecords.filter(r => {
                const matchesQuery = (r.plaka && r.plaka.toLowerCase().includes(query)) ||
                                     (r.yapilan_islem && r.yapilan_islem.toLowerCase().includes(query)) ||
                                     (r.sofor_bilgi && r.sofor_bilgi.toLowerCase().includes(query));

                if (!matchesQuery) return false;

                const itemDate = r.tarih;

                if (selectedDateFilter === 'today') {
                    return itemDate === todayStr;
                } else if (selectedDateFilter === 'week') {
                    return itemDate >= weekStartStr && itemDate <= todayStr;
                } else if (selectedDateFilter === 'month') {
                    return itemDate >= monthStartStr && itemDate <= todayStr;
                } else if (selectedDateFilter === 'custom' && selectedCustomDate) {
                    return itemDate === selectedCustomDate;
                }

                return true;
            });

            if (currentFilter === 'guarantee') {
                filtered = filtered.filter(r => r.garanti_bitis);
            }

            renderList(filtered);
        }

        function renderList(records) {
            const container = document.getElementById('records-list');
            container.innerHTML = '';

            if (records.length === 0) {
                container.innerHTML = '<div style="padding:20px 0; color:#64748b; font-size:0.85em;">Kayıt bulunamadı.</div>';
                return;
            }

            records.forEach(item => {
                const sheetItem = document.createElement('div');
                sheetItem.className = 'sheet-item';
                
                const phone = extractPhoneNumber(item.sofor_bilgi);
                let contactBtns = '';
                if (phone) {
                    contactBtns = `
                        <a href="tel:${phone}" class="contact-link">Ara</a>
                        <a href="https://wa.me/90${phone.substring(1)}" target="_blank" class="contact-link">WhatsApp</a>
                    `;
                }

                const clickableClass = isLoggedIn ? 'clickable' : '';
                const arrowHtml = isLoggedIn ? `<span id="arrow-${item.id}" class="arrow-icon">▼</span>` : '';

                sheetItem.innerHTML = `
                    <div class="sheet-summary ${clickableClass}" onclick="toggleCard(${item.id})">
                        <div class="summary-main">
                            <span class="plaka-text">${item.plaka}</span>
                            <span class="divider-dot">•</span>
                            <span class="islem-text">${item.yapilan_islem}</span>
                        </div>
                        <div class="summary-side">
                            <span class="tarih-text">${formatDate(item.tarih)}</span>
                            ${arrowHtml}
                        </div>
                    </div>

                    ${isLoggedIn ? `
                        <div id="details-${item.id}" class="sheet-details">
                            <div class="detail-block">
                                <span class="detail-label">İşlem Detayı:</span> ${item.yapilan_islem}
                            </div>
                            
                            <div class="meta-row">
                                ${item.ucret ? `<div class="meta-item"><b>Ücret:</b> ${item.ucret}</div>` : ''}
                                ${item.garanti_bitis ? `<div class="meta-item"><b>Garanti Bitiş:</b> ${formatDate(item.garanti_bitis)}</div>` : ''}
                                ${item.sofor_bilgi ? `<div class="meta-item"><b>Şoför:</b> ${item.sofor_bilgi} ${contactBtns}</div>` : ''}
                            </div>

                            ${item.foto_url ? `
                                <div>
                                    <img src="${item.foto_url}" class="img-thumb" loading="lazy" onclick="openLightbox('${item.foto_url}')">
                                </div>
                            ` : ''}

                            <div class="action-row">
                                <button class="btn-link" onclick="openEditRecordModal(${item.id})">Düzenle</button>
                                <button class="btn-link danger" onclick="deleteRecord(${item.id}, '${item.plaka}')">Sil</button>
                            </div>
                        </div>
                    ` : ''}
                `;
                container.appendChild(sheetItem);
            });
        }

        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.ready();
        loadRecords();
    </script>
</body>
</html>
