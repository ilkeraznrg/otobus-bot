<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otobüs Servis Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        h2 { margin-top: 0; color: #1a252f; text-align: center; }
        .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .plaka { font-weight: bold; font-size: 1.1em; color: #0088cc; }
        .tarih { font-size: 0.85em; color: #7f8c8d; float: right; }
        .islem { margin: 8px 0; font-size: 0.95em; }
        .garanti { font-size: 0.85em; color: #27ae60; font-weight: 500; }
        .img-link { display: inline-block; margin-top: 5px; color: #3498db; text-decoration: none; font-size: 0.85em; }
        .loader { text-align: center; padding: 20px; color: #7f8c8d; }
    </style>
</head>
<body>

    <h2>🚌 Servis Geçmişi</h2>
    <div id="loading" class="loader">Kayıtlar yükleniyor...</div>
    <div id="records-list"></div>

    <script>
        // Supabase Bağlantı Bilgileri
        const SUPABASE_URL = "https://haqxyfhdfulvutqinuhc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhcXh5ZmhkZnVsdnV0cWludWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mzk0MzMsImV4cCI6MjEwMDIxNTQzM30.g3L_pR9Y9dm2uajA0mFT3nveEI8pxEQbWcZ46Q6rAos"; 

        // Degisken ismini 'supabaseClient' yaparak çakışmayı önledik
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadRecords() {
            try {
                const { data, error } = await supabaseClient
                    .from('servis_kayitlari')
                    .select('*')
                    .order('created_at', { ascending: false });

                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('records-list');

                if (error) {
                    console.error("Supabase Hatası:", error);
                    container.innerHTML = `<div class="card" style="color:red;">Veri çekilemedi: ${error.message}</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="card" style="text-align:center;">Henüz servis kaydı bulunmuyor.</div>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <span class="plaka">${item.plaka}</span>
                            <span class="tarih">${item.tarih || ''}</span>
                        </div>
                        <div class="islem">🔧 ${item.yapilan_islem}</div>
                        ${item.garanti_bitis ? `<div class="garanti">🛡 Garanti Bitiş: ${item.garanti_bitis}</div>` : ''}
                        ${item.foto_url ? `<a href="${item.foto_url}" target="_blank" class="img-link">🖼 Servis Fotoğrafını Gör</a>` : ''}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('records-list').innerHTML = '<div class="card" style="color:red;">Bağlantı hatası oluştu.</div>';
                console.error(err);
            }
        }

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
        }
        loadRecords();
    </script>
</body>
</html>
