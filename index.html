<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Servis Takip Paneli</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0 0 40px 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header { 
            background: #0f172a;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { margin: 0; font-size: 1em; font-weight: 600; letter-spacing: -0.01em; }
        
        .btn-auth {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-auth:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-auth.logout { background: #dc2626; border-color: #dc2626; }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        /* BUTONLAR */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88em;
            cursor: pointer;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        /* ISTATISTIK BARI */
        .stats-bar { display: flex; gap: 10px; margin-bottom: 16px; }
        .stat-card {
            flex: 1;
            background: var(--surface);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .stat-card.active { border-color: var(--primary); background: #f0f6ff; }
        .stat-val { font-size: 1.2em; font-weight: 700; color: var(--text-main); }
        .stat-lbl { font-size: 0.7em; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 2px; }

        /* ARAMA KUTUSU */
        .search-box {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.88em;
            margin-bottom: 16px;
            outline: none;
            background: var(--surface);
            color: var(--text-main);
        }
        .search-box:focus { border-color: var(--primary); }

        /* KART YAPISI (SADE & MODERN) */
        .card {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .card-summary {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .card-summary.clickable { cursor: pointer; }
        .card-summary.clickable:active { background: #f8fafc; }

        .summary-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
        
        .plaka-badge {
            background: #f1f5f9;
            color: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.8em;
            border: 1px solid #cbd5e1;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .summary-title {
            font-size: 0.85em;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .tarih { font-size: 0.75em; color: var(--text-muted); font-weight: 500; }
        .arrow-icon { font-size: 0.7em; color: var(--text-muted); transition: transform 0.2s; }

        /* DETAY PANELİ (SADECE GİRİŞ YAPANLARA ÖZEL) */
        .card-details {
            display: none;
            padding: 14px;
            background: #fafafa;
            border-top: 1px solid var(--border);
        }

        .detail-row { font-size: 0.85em; color: #334155; margin-bottom: 8px; line-height: 1.5; }
        .detail-label { font-weight: 600; color: #0f172a; }

        .badges-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 500;
            background: #fff;
            border: 1px solid var(--border);
            color: #475569;
        }

        .contact-links { display: inline-flex; gap: 8px; margin-left: 6px; }
        .contact-link {
            font-size: 0.75em;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
        }

        .img-container { margin-top: 12px; }
        .img-thumb {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: var(--text-main);
        }
        .btn-delete { color: var(--danger); border-color: #fecaca; background: #fef2f2; }

        .loader { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85em; }

        /* MODAL STİLLERİ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 14px; font-size: 1em; font-weight: 600; }
        .modal-content label { font-size: 0.75em; font-weight: 600; color: #475569; display: block; margin-top: 10px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 9px 11px;
            margin-top: 4px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
        }
        .modal-content input:focus, .modal-content textarea:focus { border-color: var(--primary); }

        .preview-box {
            margin-top: 8px;
            padding: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
        .preview-img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
        .btn-remove-photo {
            background: transparent;
            color: var(--danger);
            border: none;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            margin-top: 14px;
        }
        .btn-cancel {
            width: 100%;
            padding: 9px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            margin-top: 4px;
            font-size: 0.8em;
            cursor: pointer;
        }
        .error-msg { color: var(--danger); font-size: 0.75em; margin-top: 6px; display: none; }

        /* LIGHTBOX */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .lightbox-img { max-width: 100%; max-height: 90vh; border-radius: 6px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="header-title">Servis Takip Paneli</h2>
        <button id="auth-btn" class="btn-auth" onclick="handleAuthClick()">Usta Girişi</button>
    </div>

    <div class="container">
        <button id="add-record-btn" class="btn-primary" onclick="openAddRecordModal()">+ Yeni Servis Kaydı Ekle</button>

        <div class="stats-bar">
            <div class="stat-card active" id="card-total" onclick="setFilter('all')">
                <div class="stat-val" id="total-count">0</div>
                <div class="stat-lbl">Tüm Kayıtlar</div>
            </div>
            <div class="stat-card" id="card-guarantee" onclick="setFilter('guarantee')">
                <div class="stat-val" id="guarantee-count">0</div>
                <div class="stat-lbl">Garantililer</div>
            </div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Plaka, şoför veya işlem ara..." onkeyup="filterRecords()">

        <div id="loading" class="loader">Kayıtlar yükleniyor...</div>
        <div id="records-list"></div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>Usta Girişi</h3>
            <input type="text" id="login-username" placeholder="Kullanıcı Adı">
            <input type="password" id="login-password" placeholder="Şifre">
            <button class="btn-save" onclick="loginUser()">Giriş Yap</button>
            <button class="btn-cancel" onclick="closeModal('login-modal')">İptal</button>
            <div id="login-error" class="error-msg">Hatalı kullanıcı adı veya şifre!</div>
        </div>
    </div>

    <div id="record-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Yeni Servis Kaydı</h3>
            <input type="hidden" id="rec-id">
            <input type="hidden" id="existing-foto-url">

            <label>Otobüs Plakası *</label>
            <input type="text" id="rec-plaka" list="plaka-suggestions" placeholder="Örn: 46 H 0123" style="text-transform: uppercase;">
            <datalist id="plaka-suggestions"></datalist>

            <label>Yapılan İşlem *</label>
            <textarea id="rec-islem" rows="3" placeholder="Yapılan işlemi yazın..."></textarea>

            <label>Garanti Bitiş Tarihi</label>
            <input type="date" id="rec-garanti">

            <label>Alınan Ücret</label>
            <input type="text" id="rec-ucret" placeholder="Örn: 1500 TL">

            <label>Şoför / İletişim Bilgisi</label>
            <input type="text" id="rec-sofor" placeholder="Örn: Ahmet Yılmaz - 0532 000 0000">

            <label id="foto-label">Servis Fotoğrafı</label>
            
            <div id="photo-preview-box" class="preview-box">
                <img id="preview-img" class="preview-img" src="" alt="Fotoğraf">
                <span style="font-size:0.75em; color:#64748b; flex:1; margin-left:8px;">Mevcut Fotoğraf</span>
                <button type="button" class="btn-remove-photo" onclick="removeCurrentPhoto()">Kaldır</button>
            </div>

            <input type="file" id="rec-foto" accept="image/*">

            <button id="save-btn" class="btn-save" onclick="saveRecord()">Kaydet</button>
            <button class="btn-cancel" onclick="closeModal('record-modal')">İptal</button>
            <div id="record-error" class="error-msg"></div>
        </div>
    </div>

    <div id="lightbox-modal" class="lightbox-modal" onclick="closeLightbox()">
        <img id="lightbox-img" class="lightbox-img" src="" alt="Fotoğraf">
    </div>

    <script>
        const SUPABASE_URL = "https://haqxyfhdfulvutqinuhc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhcXh5ZmhkZnVsdnV0cWludWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mzk0MzMsImV4cCI6MjEwMDIxNTQzM30.g3L_pR9Y9dm2uajA0mFT3nveEI8pxEQbWcZ46Q6rAos"; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allRecords = [];
        let isLoggedIn = false;
        let currentFilter = 'all';
        let isPhotoDeletedInModal = false;

        const INACTIVITY_LIMIT = 15 * 60 * 1000;
        let inactivityTimer;

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (isLoggedIn) {
                inactivityTimer = setTimeout(() => {
                    logoutUser("Oturum süreniz doldu.");
                }, INACTIVITY_LIMIT);
            }
        }

        ['touchstart', 'mousemove', 'keydown', 'scroll', 'click'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer, true);
        });

        function formatDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('.')) return dateStr;
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function extractPhoneNumber(text) {
            if (!text) return null;
            const match = text.match(/(05\d{2}[-\s]?\d{3}[-\s]?\d{2}[-\s]?\d{2})/);
            return match ? match[0].replace(/[-\s]/g, '') : null;
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        async function compressImageBrowser(file, maxWidth = 1280, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                };
            });
        }

        function toggleCard(id) {
            if (!isLoggedIn) return; // Giriş yapmayan kullanıcı kartı açamaz
            
            const details = document.getElementById(`details-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            if (details.style.display === 'block') {
                details.style.display = 'none';
                if (arrow) arrow.innerText = '▼';
            } else {
                details.style.display = 'block';
                if (arrow) arrow.innerText = '▲';
            }
        }

        function checkSession() {
            const savedUser = localStorage.getItem('panel_user');
            const addBtn = document.getElementById('add-record-btn');
            const authBtn = document.getElementById('auth-btn');
            
            if (savedUser) {
                isLoggedIn = true;
                authBtn.innerText = 'Çıkış Yap';
                authBtn.classList.add('logout');
                if (addBtn) addBtn.style.display = 'block';
                resetInactivityTimer();
            } else {
                isLoggedIn = false;
                authBtn.innerText = 'Usta Girişi';
                authBtn.classList.remove('logout');
                if (addBtn) addBtn.style.display = 'none';
                clearTimeout(inactivityTimer);
            }
        }

        function logoutUser(message = null) {
            localStorage.removeItem('panel_user');
            checkSession();
            filterRecords();
            if (message) alert(message);
        }

        function handleAuthClick() {
            if (isLoggedIn) {
                logoutUser();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
                document.getElementById('login-error').style.display = 'none';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function openAddRecordModal() {
            document.getElementById('modal-title').innerText = "Yeni Servis Kaydı";
            document.getElementById('rec-id').value = "";
            document.getElementById('existing-foto-url').value = "";
            document.getElementById('rec-plaka').value = "";
            document.getElementById('rec-islem').value = "";
            document.getElementById('rec-garanti').value = "";
            document.getElementById('rec-ucret').value = "";
            document.getElementById('rec-sofor').value = "";
            document.getElementById('rec-foto').value = "";
            document.getElementById('photo-preview-box').style.display = 'none';
            isPhotoDeletedInModal = false;

            document.getElementById('record-modal').style.display = 'flex';
            document.getElementById('record-error').style.display = 'none';
        }

        function openEditRecordModal(id) {
            const item = allRecords.find(r => r.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = "Kaydı Düzenle";
            document.getElementById('rec-id').value = item.id;
            document.getElementById('existing-foto-url').value = item.foto_url || "";
            document.getElementById('rec-plaka').value = item.plaka || "";
            document.getElementById('rec-islem').value = item.yapilan_islem || "";
            document.getElementById('rec-garanti').value = item.garanti_bitis || "";
            document.getElementById('rec-ucret').value = item.ucret || "";
            document.getElementById('rec-sofor').value = item.sofor_bilgi || "";
            document.getElementById('rec-foto').value = "";
            isPhotoDeletedInModal = false;

            if (item.foto_url) {
                document.getElementById('preview-img').src = item.foto_url;
                document.getElementById('photo-preview-box').style.display = 'flex';
            } else {
                document.getElementById('photo-preview-box').style.display = 'none';
            }

            document.getElementById('record-modal').style.display = 'flex';
            document.getElementById('record-error').style.display = 'none';
        }

        function removeCurrentPhoto() {
            isPhotoDeletedInModal = true;
            document.getElementById('photo-preview-box').style.display = 'none';
            document.getElementById('existing-foto-url').value = "";
        }

        function setFilter(type) {
            currentFilter = type;
            document.getElementById('card-total').className = type === 'all' ? 'stat-card active' : 'stat-card';
            document.getElementById('card-guarantee').className = type === 'guarantee' ? 'stat-card active' : 'stat-card';
            filterRecords();
        }

        async function loginUser() {
            const kAdi = document.getElementById('login-username').value.trim();
            const sifre = document.getElementById('login-password').value.trim();

            const { data } = await supabaseClient
                .from('yetkili_kullanicilar')
                .select('*')
                .eq('kullanici_adi', kAdi)
                .eq('sifre', sifre);

            if (data && data.length > 0) {
                localStorage.setItem('panel_user', kAdi);
                closeModal('login-modal');
                checkSession();
                filterRecords();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function saveRecord() {
            const recId = document.getElementById('rec-id').value;
            const existingFotoUrl = document.getElementById('existing-foto-url').value;
            const plakaInput = document.getElementById('rec-plaka').value.trim();
            const islem = document.getElementById('rec-islem').value.trim();
            const garanti = document.getElementById('rec-garanti').value;
            const ucret = document.getElementById('rec-ucret').value.trim();
            const sofor = document.getElementById('rec-sofor').value.trim();
            const fotoFile = document.getElementById('rec-foto').files[0];
            const errDiv = document.getElementById('record-error');
            const saveBtn = document.getElementById('save-btn');

            if (!plakaInput || !islem) {
                errDiv.innerText = "Lütfen Plaka ve Yapılan İşlem alanlarını doldurun.";
                errDiv.style.display = 'block';
                return;
            }

            let cleanPlaka = plakaInput.replace(/\s+/g, '').toUpperCase();
            const match = cleanPlaka.match(/^(0[1-9]|[1-8][0-9])([A-Z]{1,3})(\d{1,4})$/);

            if (!match) {
                errDiv.innerText = "Geçersiz plaka formatı!";
                errDiv.style.display = 'block';
                return;
            }

            const formattedPlaka = `${match[1]} ${match[2]} ${match[3].replace(/^0+/, '').padStart(4, '0')}`;
            saveBtn.innerText = "İşleniyor...";
            saveBtn.disabled = true;

            try {
                const { data: oData } = await supabaseClient.from('otobusler').select('plaka').eq('plaka', formattedPlaka);
                if (!oData || oData.length === 0) {
                    await supabaseClient.from('otobusler').insert([{ plaka: formattedPlaka }]);
                }

                let finalFotoUrl = isPhotoDeletedInModal ? null : existingFotoUrl;

                if (fotoFile) {
                    const compressedBlob = await compressImageBrowser(fotoFile, 1280, 0.75);
                    const filePath = `${formattedPlaka}_${Date.now()}.jpg`;
                    
                    const { error: stErr } = await supabaseClient.storage.from('servis-fotolari').upload(filePath, compressedBlob, { contentType: 'image/jpeg' });
                    
                    if (!stErr) {
                        const { data: pUrl } = supabaseClient.storage.from('servis-fotolari').getPublicUrl(filePath);
                        finalFotoUrl = pUrl.publicUrl;
                    }
                }

                const payload = {
                    plaka: formattedPlaka,
                    yapilan_islem: islem,
                    garanti_bitis: garanti || null,
                    ucret: ucret || null,
                    sofor_bilgi: sofor || null,
                    foto_url: finalFotoUrl
                };

                if (recId) {
                    await supabaseClient.from('servis_kayitlari').update(payload).eq('id', recId);
                } else {
                    payload.tarih = new Date().toISOString().split('T')[0];
                    await supabaseClient.from('servis_kayitlari').insert([payload]);
                }

                closeModal('record-modal');
                loadRecords();

            } catch (err) {
                errDiv.innerText = "Hata oluştu: " + err.message;
                errDiv.style.display = 'block';
            } finally {
                saveBtn.innerText = "Kaydet";
                saveBtn.disabled = false;
            }
        }

        async function deleteRecord(id, plaka) {
            if (!confirm(`${plaka} plakalı bu kaydı silmek istediğinize emin misiniz?`)) return;
            await supabaseClient.from('servis_kayitlari').delete().eq('id', id);
            loadRecords();
        }

        function updatePlakaSuggestions() {
            const datalist = document.getElementById('plaka-suggestions');
            if (!datalist) return;
            datalist.innerHTML = '';
            const uniquePlakas = [...new Set(allRecords.map(r => r.plaka).filter(Boolean))];
            uniquePlakas.forEach(plaka => {
                const option = document.createElement('option');
                option.value = plaka;
                datalist.appendChild(option);
            });
        }

        async function loadRecords() {
            try {
                const { data } = await supabaseClient
                    .from('servis_kayitlari')
                    .select('*')
                    .order('created_at', { ascending: false });

                document.getElementById('loading').style.display = 'none';
                allRecords = data || [];
                
                document.getElementById('total-count').innerText = allRecords.length;
                document.getElementById('guarantee-count').innerText = allRecords.filter(r => r.garanti_bitis).length;

                updatePlakaSuggestions();
                checkSession();
                filterRecords();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterRecords() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = allRecords.filter(r => 
                (r.plaka && r.plaka.toLowerCase().includes(query)) ||
                (r.yapilan_islem && r.yapilan_islem.toLowerCase().includes(query)) ||
                (r.sofor_bilgi && r.sofor_bilgi.toLowerCase().includes(query))
            );

            if (currentFilter === 'guarantee') {
                filtered = filtered.filter(r => r.garanti_bitis);
            }

            renderList(filtered);
        }

        function renderList(records) {
            const container = document.getElementById('records-list');
            container.innerHTML = '';

            if (records.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b; font-size:0.85em;">Kayıt bulunamadı.</div>';
                return;
            }

            records.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const phone = extractPhoneNumber(item.sofor_bilgi);
                let contactBtns = '';
                if (phone) {
                    contactBtns = `
                        <span class="contact-links">
                            <a href="tel:${phone}" class="contact-link">Ara</a>
                            <a href="https://wa.me/90${phone.substring(1)}" target="_blank" class="contact-link">WhatsApp</a>
                        </span>
                    `;
                }

                // Sadece giriş yapılmışsa ok simgesi ve tıklama özelliği ekle
                const clickableClass = isLoggedIn ? 'clickable' : '';
                const arrowHtml = isLoggedIn ? `<span id="arrow-${item.id}" class="arrow-icon">▼</span>` : '';

                card.innerHTML = `
                    <div class="card-summary ${clickableClass}" onclick="toggleCard(${item.id})">
                        <div class="summary-left">
                            <span class="plaka-badge">${item.plaka}</span>
                            <span class="summary-title">${item.yapilan_islem}</span>
                        </div>
                        <div class="summary-right">
                            <span class="tarih">${formatDate(item.tarih)}</span>
                            ${arrowHtml}
                        </div>
                    </div>

                    ${isLoggedIn ? `
                        <div id="details-${item.id}" class="card-details">
                            <div class="detail-row">
                                <span class="detail-label">İşlem Detayı:</span><br>${item.yapilan_islem}
                            </div>
                            
                            <div class="badges-row">
                                ${item.ucret ? `<span class="badge">Ücret: ${item.ucret}</span>` : ''}
                                ${item.garanti_bitis ? `<span class="badge">Garanti: ${formatDate(item.garanti_bitis)}</span>` : ''}
                                ${item.sofor_bilgi ? `<span class="badge">Şoför: ${item.sofor_bilgi} ${contactBtns}</span>` : ''}
                            </div>

                            ${item.foto_url ? `
                                <div class="img-container">
                                    <img src="${item.foto_url}" class="img-thumb" loading="lazy" onclick="openLightbox('${item.foto_url}')">
                                </div>
                            ` : ''}

                            <div class="card-actions">
                                <button class="btn-action" onclick="openEditRecordModal(${item.id})">Düzenle</button>
                                <button class="btn-action btn-delete" onclick="deleteRecord(${item.id}, '${item.plaka}')">Sil</button>
                            </div>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.ready();
        loadRecords();
    </script>
</body>
</html>
